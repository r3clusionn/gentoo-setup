Section "InputClass"
    Identifier "touchpad"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "Tapping" "on"
    Option "NaturalScrolling" "true"
    # games: WASD held must not switch the touchpad off
    Option "DisableWhileTyping" "false"
    # no pointer acceleration: the same finger movement always moves the same distance
    Option "AccelProfile" "flat"
    # flat: movement = (1 + speed) x; 0.7 = 1.7x
    Option "AccelSpeed" "0.7"
EndSection

# the touchpad's mouse node and any plugged-in mouse: no acceleration either
Section "InputClass"
    Identifier "pointer"
    MatchIsPointer "on"
    Driver "libinput"
    Option "AccelProfile" "flat"
    # flat: movement = (1 + speed) x; 0.7 = 1.7x
    Option "AccelSpeed" "0.7"
EndSection
