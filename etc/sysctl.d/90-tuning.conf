# Laptop tuning (minimization plan, batch 4)
vm.dirty_writeback_centisecs = 1500
# Size kernel memory reserves for a 64 GB machine instead of scaling blindly.
# Changes reported "used" RAM (fastfetch/free), not actual free memory.
vm.lowmem_reserve_ratio = 0 0 0 0 0
vm.min_free_kbytes = 8192
vm.watermark_scale_factor = 1
# 2026-10-18 (CachyOS/zen defaults): no proactive compaction, so kcompactd sleeps instead of
# waking every 500 ms; no watermark boosting, so kswapd never evicts extra page cache after a
# fragmentation event. THP (madvise only) still compacts on demand.
vm.compaction_proactiveness = 0
vm.watermark_boost_factor = 0
