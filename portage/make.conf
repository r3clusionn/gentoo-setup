# System-wide LTO (Gentoo wiki LTO recipe, GCC)
# batch 20: no hardening (gcc USE in package.use/batch20 changes the defaults; these cover FORTIFY and the bootstrap)
NOHARDEN_FLAGS="-fno-stack-protector -fcf-protection=none -fno-stack-clash-protection -U_FORTIFY_SOURCE"
COMMON_FLAGS="-march=native -O3 -pipe -flto -fno-semantic-interposition ${NOHARDEN_FLAGS}"
WARNING_FLAGS="-Werror=odr -Werror=lto-type-mismatch -Werror=strict-aliasing"
CFLAGS="${COMMON_FLAGS} ${WARNING_FLAGS}"
CXXFLAGS="${COMMON_FLAGS} ${WARNING_FLAGS}"
FCFLAGS="${COMMON_FLAGS} ${WARNING_FLAGS}"
FFLAGS="${COMMON_FLAGS} ${WARNING_FLAGS}"
LDFLAGS="${COMMON_FLAGS} -Wl,-O1 -Wl,--as-needed -Wl,-z,pack-relative-relocs -Wl,-z,lazy -Wl,-z,norelro"
RUSTFLAGS="-C target-cpu=native"
MAKEOPTS="-j24 -l24"
EMERGE_DEFAULT_OPTS="--jobs=4 --load-average=24 --with-bdeps=n --usepkg"
FEATURES="buildpkg -sandbox -usersandbox -xattr"
# batch 21 audit (2026-10-17): every binpkg is rewritten by the emerge -e; zstd -19 makes the cache ~18% smaller
BINPKG_COMPRESS_FLAGS="-19 -T0"
PORTAGE_SCHEDULING_POLICY="idle"
USE="X elogind dbus udev alsa pipewire pulseaudio vaapi vulkan -wayland -qt6 -policykit -introspection -nls lto"
ACCEPT_LICENSE="-* @FREE @BINARY-REDISTRIBUTABLE"
VIDEO_CARDS="amdgpu radeonsi"
LLVM_TARGETS="AMDGPU BPF X86"
L10N="en"
INSTALL_MASK="/usr/share/doc /usr/share/info /usr/share/gtk-doc /usr/share/help /usr/share/locale -/usr/share/locale/locale.alias /usr/share/man /usr/share/gcc-data/*/*/man *.opt-1.pyc *.opt-2.pyc /usr/x86_64-pc-linux-gnu/gcc-bin/*/lto-dump /usr/lib/udev/hwdb.d/20-* /usr/share/hwdata/oui.txt /usr/share/hwdata/iab.txt /usr/lib/go/test /usr/lib/gcc/x86_64-pc-linux-gnu/*/plugin"
LC_MESSAGES=C.utf8

# GENTOO_MIRRORS: a few HTTPS mirrors near you (https://www.gentoo.org/downloads/mirrors/)
GENTOO_MIRRORS="https://distfiles.gentoo.org"
PORTAGE_COMPRESS="gzip"

# curl instead of wget (wget removed from @system)
FETCHCOMMAND="curl --retry 3 --connect-timeout 60 -fL -o \"\${DISTDIR}/\${FILE}\" \"\${URI}\""
RESUMECOMMAND="curl -C - --retry 3 --connect-timeout 60 -fL -o \"\${DISTDIR}/\${FILE}\" \"\${URI}\""
# 2026-10-18 perf audit: malloc asks for THP in build processes (glslang A/B: 80.3 -> 77.1 s, ~4%; ~256 MB huge pages while building)
GLIBC_TUNABLES="glibc.malloc.hugetlb=1"
